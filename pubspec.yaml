name: pbh_oficial
description: "PBH Oficial — app de desenvolvimento pessoal masculino, disciplina e evolução contínua."
publish_to: 'none'
version: 1.0.1+43

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  share_plus: ^9.0.0
  supabase_flutter: ^2.14.2
  audioplayers: ^6.8.1
  http: ^1.6.0
  crypto: ^3.0.6
  flutter_web_auth_2: ^5.1.0
  webview_flutter: ^4.14.1
  web: ^0.5.1
  shared_preferences: ^2.3.1
  image_picker: ^1.2.1
  flutter_local_notifications: 19.5.0
  flutter_timezone: 5.1.1
  timezone: 0.10.1
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.0
  # Fonte usada: Manrope (grotesca geométrica, moderna, mesmo espírito
  # tipográfico do design de referência — hierarquia forte, tracking largo
  # nos títulos, ótima legibilidade em dark mode).

dev_dependencies:
  shared_preferences_platform_interface: ^2.4.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: 0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: web/icons/Icon-512.png
  remove_alpha_ios: true
