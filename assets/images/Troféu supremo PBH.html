<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Troféu supremo PBH</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Spectral:wght@400;500&display=swap">
<style>
:root{--bg:#f3eefb;--fg:#1d1233;--muted:#5d4d80;--card:#ffffff;--line:#d9ccf0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07030f;--fg:#efe6ff;--muted:#a994d6;--card:#110822;--line:#2a1750;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#07030f;--fg:#efe6ff;--muted:#a994d6;--card:#110822;--line:#2a1750;color-scheme:dark}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:"Spectral",Georgia,serif;display:flex;justify-content:center;padding:24px 16px}
main{width:100%;max-width:560px}
.stage{background:#030108;border-radius:20px;overflow:hidden;box-shadow:0 0 60px rgba(150,70,255,.35)}
svg{display:block;width:100%;height:auto}
.card{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
h1{font-family:"Cinzel",Georgia,serif;font-weight:900;font-size:1.6rem;margin:0 0 6px;letter-spacing:.02em}
.tag{font-family:"Cinzel",Georgia,serif;font-weight:700;font-size:.85rem;color:#b8861b;margin:0 0 10px}
p{margin:0;line-height:1.55;color:var(--muted);font-size:1.05rem}
/* animações do SVG */
.float{animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.spin{transform-origin:300px 185px;animation:spin 26s linear infinite}
.spin2{transform-origin:300px 185px;animation:spin 40s linear infinite reverse}
.ring{transform-origin:300px 300px;animation:spin 90s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.crack{animation:crack 3.4s ease-in-out infinite}
@keyframes crack{0%,100%{opacity:.75}50%{opacity:1}}
.rays line{animation:ray 3s ease-in-out infinite}
@keyframes ray{0%,100%{opacity:.45}50%{opacity:1}}
.aura{transform-origin:300px 300px;animation:aura 4.5s ease-in-out infinite}
@keyframes aura{0%,100%{transform:scale(.96);opacity:.7}50%{transform:scale(1.05);opacity:1}}
.p{transform-box:fill-box;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-360px);opacity:0}}
.tw{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
.sheen{animation:sheen 6s ease-in-out infinite}
@keyframes sheen{0%,55%{transform:translateX(-380px)}100%{transform:translateX(380px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main>
<div class="stage">
<svg viewBox="0 0 600 600" role="img" aria-label="Troféu supremo PBH: hexágono de pedra com rachaduras douradas e um meditador feito de luz, com halos, coroa e espada">
<defs>
  <radialGradient id="bg" cx="50%" cy="48%" r="62%"><stop offset="0" stop-color="#341266"/><stop offset=".55" stop-color="#0d0420"/><stop offset="1" stop-color="#030108"/></radialGradient>
  <radialGradient id="glowc" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#a45cff" stop-opacity=".55"/><stop offset=".6" stop-color="#6d28d9" stop-opacity=".18"/><stop offset="1" stop-color="#6d28d9" stop-opacity="0"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6c9"/><stop offset=".35" stop-color="#f6cc4f"/><stop offset=".7" stop-color="#b9811c"/><stop offset="1" stop-color="#ffe58a"/></linearGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c58cff"/><stop offset="1" stop-color="#4a17a8"/></linearGradient>
  <linearGradient id="body" gradientUnits="userSpaceOnUse" x1="300" y1="160" x2="300" y2="410"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#e2c9ff"/><stop offset="1" stop-color="#8a4af2"/></linearGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9aa0b5"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#8a90a8"/></linearGradient>
  <linearGradient id="shn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="glowG" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="stone" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="4" seed="7" result="n"/><feDiffuseLighting in="n" lighting-color="#d2b0ff" surfaceScale="2.4" result="l"><feDistantLight azimuth="225" elevation="55"/></feDiffuseLighting><feComposite in="l" in2="SourceGraphic" operator="in" result="lc"/><feBlend in="SourceGraphic" in2="lc" mode="multiply"/></filter>
  <clipPath id="ci"><polygon points="300,72 497,186 497,414 300,528 103,414 103,186"/></clipPath>
  <clipPath id="co"><polygon points="300,40 525,170 525,430 300,560 75,430 75,170"/></clipPath>
</defs>

<rect width="600" height="600" fill="url(#bg)"/>
<circle class="aura" cx="300" cy="300" r="290" fill="url(#glowc)"/>
<circle class="ring" cx="300" cy="300" r="287" fill="none" stroke="#f6cc4f" stroke-opacity=".5" stroke-width="1.5" stroke-dasharray="2 14"/>

<!-- hexágono fantasma: a conquista passou do próprio limite -->
<polygon points="300,40 525,170 525,430 300,560 75,430 75,170" transform="rotate(30 300 300) scale(1.1) translate(-27.3 -27.3)" fill="none" stroke="#f6cc4f" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="6 8"/>

<!-- moldura de pedra -->
<polygon points="300,40 525,170 525,430 300,560 75,430 75,170" fill="url(#rim)" filter="url(#stone)"/>
<polygon points="300,72 497,186 497,414 300,528 103,414 103,186" fill="#050110"/>
<polygon points="300,40 525,170 525,430 300,560 75,430 75,170" fill="none" stroke="#e9d5ff" stroke-width="2" filter="url(#glow)"/>
<polygon points="300,72 497,186 497,414 300,528 103,414 103,186" fill="none" stroke="#c58cff" stroke-width="2" filter="url(#glow)"/>

<!-- rachaduras preenchidas por luz dourada -->
<g class="crack" fill="none" stroke="url(#gold)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowG)">
  <path d="M300 40 L306 52 L296 62 L300 72"/>
  <path d="M525 300 L512 305 L520 322 L497 330"/>
  <path d="M300 560 L296 546 L305 536 L300 528"/>
  <path d="M75 300 L88 308 L80 322 L103 330"/>
  <path d="M187 105 L196 114 L190 122 L201 129"/>
  <path d="M412 105 L404 115 L410 122 L398 129"/>
  <path d="M412 495 L405 486 L410 478 L398 471"/>
  <path d="M187 495 L195 487 L190 479 L202 471"/>
</g>
<g id="gems" filter="url(#glowG)"></g>

<!-- partículas subindo -->
<g id="parts" clip-path="url(#ci)"></g>

<!-- halos -->
<g fill="none" filter="url(#glow)">
  <circle cx="300" cy="185" r="54" stroke="url(#gold)" stroke-width="2.5"/>
  <circle class="spin" cx="300" cy="185" r="68" stroke="#f6cc4f" stroke-width="2" stroke-dasharray="18 8"/>
  <circle class="spin2" cx="300" cy="185" r="82" stroke="#e9d5ff" stroke-width="2" stroke-dasharray="2 9" stroke-linecap="round"/>
</g>
<g class="rays" id="rays" stroke="#fff3c4" stroke-width="3" stroke-linecap="round" filter="url(#glowG)"></g>

<!-- meditador de luz -->
<ellipse cx="300" cy="422" rx="86" ry="6" fill="#a45cff" opacity=".55" filter="url(#glow)"/>
<g class="float">
  <g fill="url(#body)" stroke="url(#body)" filter="url(#glow)">
    <circle cx="300" cy="186" r="25" stroke="none"/>
    <path d="M262 232 Q300 218 338 232 L350 300 Q300 318 250 300 Z" stroke="none"/>
    <path d="M262 236 Q236 270 226 308 Q222 322 214 328" fill="none" stroke-width="20" stroke-linecap="round"/>
    <path d="M338 236 Q364 270 374 308 Q378 322 386 328" fill="none" stroke-width="20" stroke-linecap="round"/>
    <circle cx="212" cy="330" r="11" stroke="none"/>
    <circle cx="388" cy="330" r="11" stroke="none"/>
    <path d="M206 352 Q300 316 394 352 Q426 376 390 396 Q300 420 210 396 Q174 376 206 352 Z" stroke="none"/>
  </g>
  <g fill="none" stroke="#3a1380" stroke-width="2" stroke-linecap="round" opacity=".8">
    <path d="M215 392 Q270 372 345 398"/><path d="M385 392 Q330 372 255 398"/>
    <circle cx="212" cy="330" r="5"/><circle cx="388" cy="330" r="5"/>
  </g>
  <g id="const" stroke="#fff3c4" stroke-width="1" fill="#fff3c4"></g>
  <circle class="tw" cx="300" cy="262" r="6" fill="#fff" filter="url(#glowG)"/>
</g>

<!-- coroa, espada e nome -->
<g filter="url(#glowG)">
  <path d="M280 452 L276 432 L290 442 L300 426 L310 442 L324 432 L320 452 Z" fill="url(#gold)" stroke="#7a5200" stroke-width="1"/>
  <circle cx="276" cy="430" r="2.5" fill="#fff6c9"/><circle cx="300" cy="424" r="2.5" fill="#fff6c9"/><circle cx="324" cy="430" r="2.5" fill="#fff6c9"/>
</g>
<text x="300" y="498" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-weight="900" font-size="42" letter-spacing="5" fill="url(#gold)" stroke="#5a3a00" stroke-width=".8" filter="url(#glowG)">PBH</text>

<!-- brilho de platina -->
<g clip-path="url(#co)"><rect class="sheen" x="150" y="0" width="120" height="600" fill="url(#shn)" transform="skewX(-18)"/></g>
</svg>
</div>

<section class="card">
  <h1>Ascensão suprema</h1>
  <p class="tag">Troféu supremo · ultra raro</p>
  <p>Alcance o nível supremo e complete a prática incontáveis vezes. A calma agora é parte de você.</p>
</section>
</main>

<script>
(function(){
  var NS="http://www.w3.org/2000/svg";
  function el(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
  // raios
  var rays=document.getElementById("rays");
  for(var a=-175;a<=-5;a+=15){
    var r=a*Math.PI/180, r1=96, r2=r1+10+Math.abs(Math.cos(r))*34;
    var l=el("line",{x1:300+r1*Math.cos(r),y1:185+r1*Math.sin(r),x2:300+r2*Math.cos(r),y2:185+r2*Math.sin(r)},rays);
    l.style.animationDelay=((a+175)/15*0.18)+"s";
  }
  // gemas e marcas de ciclo ao longo da moldura
  var O=[[300,40],[525,170],[525,430],[300,560],[75,430],[75,170]],
      I=[[300,72],[497,186],[497,414],[300,528],[103,414],[103,186]],
      M=O.map(function(p,i){return[(p[0]+I[i][0])/2,(p[1]+I[i][1])/2]}),
      g=document.getElementById("gems");
  for(var i=0;i<6;i++){
    var A=M[i],B=M[(i+1)%6];
    [0.16,0.32,0.68,0.84].forEach(function(t){
      var x=A[0]+(B[0]-A[0])*t,y=A[1]+(B[1]-A[1])*t;
      el("rect",{x:x-3,y:y-3,width:6,height:6,fill:"#ffe58a",transform:"rotate(45 "+x+" "+y+")"},g);
    });
    el("circle",{cx:A[0],cy:A[1],r:7,fill:"url(#gold)",stroke:"#fff6c9","stroke-width":1.5},g);
  }
  // partículas
  var P=document.getElementById("parts");
  for(var j=0;j<30;j++){
    var c=el("circle",{cx:130+Math.random()*340,cy:430+Math.random()*90,r:1+Math.random()*2.2,fill:Math.random()>.5?"#ffe58a":"#d9b8ff","class":"p"},P);
    c.style.animationDuration=(5+Math.random()*6)+"s";
    c.style.animationDelay=(-Math.random()*10)+"s";
  }
  // constelação dentro do corpo
  var pts=[[300,245],[280,270],[320,268],[300,296],[276,302],[324,302],[242,288],[232,312],[358,288],[368,312],[250,374],[300,360],[350,374],[300,396]],
      ed=[[0,1],[0,2],[1,3],[2,3],[1,4],[2,5],[1,6],[6,7],[2,8],[8,9],[4,10],[3,11],[5,12],[10,11],[11,12],[11,13]],
      cn=document.getElementById("const");
  ed.forEach(function(e){el("line",{x1:pts[e[0]][0],y1:pts[e[0]][1],x2:pts[e[1]][0],y2:pts[e[1]][1],opacity:.55},cn)});
  pts.forEach(function(p,k){var d=el("circle",{cx:p[0],cy:p[1],r:2,"class":"tw"},cn);d.style.animationDelay=(k*0.17)+"s"});
})();
</script>
</body>
</html>
