<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Troféu de Platina PBH</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Spectral:wght@400;500&display=swap">
<style>
:root{--bg:#edf4ff;--fg:#13243b;--muted:#526b86;--card:#ffffff;--line:#cbddec;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050d1d;--fg:#e6f5ff;--muted:#9bbdd8;--card:#101f35;--line:#25435c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#050d1d;--fg:#e6f5ff;--muted:#9bbdd8;--card:#101f35;--line:#25435c;color-scheme:dark}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:"Spectral",Georgia,serif;display:flex;justify-content:center;padding:24px 16px}
main{width:100%;max-width:560px}
.stage{background:#050d1c;border-radius:20px;overflow:hidden;box-shadow:0 0 60px rgba(255,70,50,.35)}
svg{display:block;width:100%;height:auto}
.card{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
h1{font-family:"Cinzel",Georgia,serif;font-weight:900;font-size:1.6rem;margin:0 0 6px;letter-spacing:.02em}
.tag{font-family:"Cinzel",Georgia,serif;font-weight:700;font-size:.85rem;color:#6b9ac5;margin:0 0 10px}
p{margin:0;line-height:1.55;color:var(--muted);font-size:1.05rem}
/* animações do SVG */
.float{animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.beams{transform-origin:300px 285px;animation:spin 70s linear infinite}
.ring{transform-origin:300px 300px;animation:spin 90s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wave{transform-origin:300px 285px;animation:wave 3.2s ease-out infinite}
.w2{animation-delay:1.6s}
@keyframes wave{0%{transform:scale(.45);opacity:.9}100%{transform:scale(3.3);opacity:0}}
.crack{animation:crack 3.4s ease-in-out infinite}
@keyframes crack{0%,100%{opacity:.75}50%{opacity:1}}
.aura{transform-origin:300px 300px;animation:aura 4.5s ease-in-out infinite}
@keyframes aura{0%,100%{transform:scale(.96);opacity:.7}50%{transform:scale(1.05);opacity:1}}
.p{transform-box:fill-box;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-360px);opacity:0}}
.core{animation:core 1.6s ease-in-out infinite}
@keyframes core{0%,100%{opacity:.5}50%{opacity:1}}
.sheen{animation:sheen 6s ease-in-out infinite}
@keyframes sheen{0%,55%{transform:translateX(-380px)}100%{transform:translateX(380px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* Sequência cinematográfica de desbloqueio */
.stage{position:relative;isolation:isolate;box-shadow:0 18px 65px rgba(30,140,255,.22)}
.stage svg{position:relative;z-index:1}
.stage::after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(circle at center,transparent 25%,rgba(1,7,22,.62));opacity:0}
.stage.playing::after{animation:darken 4.8s ease both}
.stage.playing svg{animation:revealBadge 4.8s cubic-bezier(.18,.75,.2,1) both}
.stage.playing .float{animation:revealCup 4.8s cubic-bezier(.2,.8,.2,1) both}
.stage.playing .aura{animation:burstAura 4.8s ease both}
@keyframes revealBadge{0%,12%{opacity:0;transform:scale(.55);filter:brightness(2.5) blur(15px)}30%{opacity:1;transform:scale(1.09);filter:brightness(2.5) blur(0)}44%{transform:scale(.97);filter:brightness(1.25)}60%,100%{transform:scale(1);filter:brightness(1)}}
@keyframes revealCup{0%,16%{opacity:0;transform:translateY(70px) scale(.7)}31%{opacity:1;transform:translateY(-13px) scale(1.09)}46%,100%{transform:translateY(0) scale(1)}}
@keyframes burstAura{0%,16%{opacity:0;transform:scale(.3)}31%{opacity:1;transform:scale(1.5)}58%,100%{opacity:.8;transform:scale(1)}}
@keyframes darken{0%,20%{opacity:.8}35%,100%{opacity:0}}
.flash{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;background:radial-gradient(circle,#fff 0%,#d0f6ff 10%,rgba(63,175,255,.5) 35%,transparent 70%)}
.playing .flash{animation:flash 4.8s ease-out both}
@keyframes flash{0%,22%,38%,100%{opacity:0}28%{opacity:.92}32%{opacity:.2}}
.fx{position:absolute;inset:0;z-index:6;pointer-events:none;width:100%;height:100%}
62%,90%{opacity:1;transform:translateY(0)}100%{opacity:1;transform:translateY(0)}}
.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:16px}
button{border:1px solid #83cfff;border-radius:12px;background:linear-gradient(135deg,#14518c,#10243d);color:#fff;font:700 14px Cinzel,serif;padding:13px 18px;cursor:pointer;box-shadow:0 4px 20px #238bff30}
button:hover{filter:brightness(1.2)}
.controls label{color:var(--muted);font:15px Spectral,serif;display:flex;align-items:center;gap:7px}
@media(prefers-reduced-motion:reduce){.stage.playing svg,.stage.playing .float,.stage.playing .aura,.stage.playing .flash,.stage.playing .unlock,.stage.playing::after{animation:none!important;opacity:1!important;transform:none!important}}
</style>
</head>
<body>
<main>
<div class="stage" id="stage">
<canvas class="fx" id="fx" width="600" height="600" aria-hidden="true"></canvas>
<div class="flash"></div>
<svg viewBox="0 0 600 600" role="img" aria-label="Troféu de Platina PBH: hexágono de platina com troféu cristalino azul e prata, com ondas de energia, raios de luz, coroa de platina e as letras PBH">
<defs>
  <radialGradient id="bg" cx="50%" cy="48%" r="62%"><stop offset="0" stop-color="#164879"/><stop offset=".55" stop-color="#08182e"/><stop offset="1" stop-color="#050d1c"/></radialGradient>
  <radialGradient id="glowc" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#70dfff" stop-opacity=".55"/><stop offset=".6" stop-color="#2b91ff" stop-opacity=".18"/><stop offset="1" stop-color="#2b91ff" stop-opacity="0"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#b6eaff"/><stop offset=".7" stop-color="#678da9"/><stop offset="1" stop-color="#d4f6ff"/></linearGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a6e6ff"/><stop offset="1" stop-color="#244d7b"/></linearGradient>
  <linearGradient id="body" gradientUnits="userSpaceOnUse" x1="300" y1="160" x2="300" y2="410"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#c9f2ff"/><stop offset="1" stop-color="#5c91ef"/></linearGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9aa0b5"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#8a90a8"/></linearGradient>
  <linearGradient id="shn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="glowG" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="stone" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="4" seed="7" result="n"/><feDiffuseLighting in="n" lighting-color="#b4e4ff" surfaceScale="2.4" result="l"><feDistantLight azimuth="225" elevation="55"/></feDiffuseLighting><feComposite in="l" in2="SourceGraphic" operator="in" result="lc"/><feBlend in="SourceGraphic" in2="lc" mode="multiply"/></filter>
  <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cb9e8"/><stop offset=".25" stop-color="#244d80"/><stop offset=".6" stop-color="#10233e"/><stop offset="1" stop-color="#467fae"/></linearGradient>
  <radialGradient id="face" cx="40%" cy="40%" r="75%"><stop offset="0" stop-color="#c9f2ff"/><stop offset=".45" stop-color="#579fd6"/><stop offset="1" stop-color="#1b3459"/></radialGradient>
  <radialGradient id="beam" gradientUnits="userSpaceOnUse" cx="300" cy="285" r="230"><stop offset="0" stop-color="#d4f6ff" stop-opacity=".5"/><stop offset="1" stop-color="#d4f6ff" stop-opacity="0"/></radialGradient>
  <pattern id="knurl" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0H6M0 0V6" stroke="#d4f6ff" stroke-opacity=".6" stroke-width="1.2"/></pattern>
  <clipPath id="ci"><polygon points="300,72 497,186 497,414 300,528 103,414 103,186"/></clipPath>
  <clipPath id="co"><polygon points="300,40 525,170 525,430 300,560 75,430 75,170"/></clipPath>
</defs>

<rect width="600" height="600" fill="url(#bg)"/>
<circle class="aura" cx="300" cy="300" r="290" fill="url(#glowc)"/>
<circle class="ring" cx="300" cy="300" r="287" fill="none" stroke="#b6eaff" stroke-opacity=".5" stroke-width="1.5" stroke-dasharray="2 14"/>

<!-- hexágono fantasma: a conquista passou do próprio limite -->
<polygon points="300,40 525,170 525,430 300,560 75,430 75,170" transform="rotate(30 300 300) scale(1.1) translate(-27.3 -27.3)" fill="none" stroke="#b6eaff" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="6 8"/>

<!-- moldura de pedra -->
<polygon points="300,40 525,170 525,430 300,560 75,430 75,170" fill="url(#rim)" filter="url(#stone)"/>
<polygon points="300,72 497,186 497,414 300,528 103,414 103,186" fill="#0a0204"/>
<polygon points="300,40 525,170 525,430 300,560 75,430 75,170" fill="none" stroke="#f0fbff" stroke-width="2" filter="url(#glow)"/>
<polygon points="300,72 497,186 497,414 300,528 103,414 103,186" fill="none" stroke="#a6e6ff" stroke-width="2" filter="url(#glow)"/>

<!-- rachaduras preenchidas por luz de platina -->
<g class="crack" fill="none" stroke="url(#gold)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowG)">
  <path d="M300 40 L306 52 L296 62 L300 72"/>
  <path d="M525 300 L512 305 L520 322 L497 330"/>
  <path d="M300 560 L296 546 L305 536 L300 528"/>
  <path d="M75 300 L88 308 L80 322 L103 330"/>
  <path d="M187 105 L196 114 L190 122 L201 129"/>
  <path d="M412 105 L404 115 L410 122 L398 129"/>
  <path d="M412 495 L405 486 L410 478 L398 471"/>
  <path d="M187 495 L195 487 L190 479 L202 471"/>
</g>
<g id="gems" filter="url(#glowG)"></g>

<!-- partículas subindo -->
<g id="parts" clip-path="url(#ci)"></g>

<!-- raios de luz e ondas de choque -->
<g clip-path="url(#ci)"><g class="beams" id="beams"></g></g>
<g clip-path="url(#ci)" fill="none" stroke="#d4f6ff" stroke-width="2.5">
  <circle class="wave" cx="300" cy="285" r="60" vector-effect="non-scaling-stroke"/>
  <circle class="wave w2" cx="300" cy="285" r="60" vector-effect="non-scaling-stroke"/>
</g>

<!-- Troféu de platina original, inspirado na linguagem visual de conquistas -->
<ellipse cx="300" cy="415" rx="118" ry="12" fill="#5bc8ff" opacity=".35" filter="url(#glow)"/>
<g class="float" filter="url(#glow)">
  <path d="M240 166 L360 166 L383 218 L355 322 L300 371 L245 322 L217 218 Z" fill="url(#steel)" stroke="#e8fbff" stroke-width="5"/>
  <path d="M240 166 L300 187 L300 371 L245 322 L217 218 Z" fill="#76b9ed" opacity=".65"/>
  <path d="M360 166 L300 187 L300 371 L355 322 L383 218 Z" fill="#f0fcff" opacity=".55"/>
  <path d="M240 166 L300 187 L360 166 L383 218 L300 251 L217 218 Z" fill="#e3f9ff" opacity=".8"/>
  <path d="M217 218 L300 251 L383 218 M300 187 L300 371 M245 322 L300 251 L355 322" fill="none" stroke="#ffffff" stroke-opacity=".7" stroke-width="3"/>
  <path d="M219 202 C170 183 164 268 228 287 L250 290 M381 202 C430 183 436 268 372 287 L350 290" fill="none" stroke="url(#steel)" stroke-width="18"/>
  <path d="M281 366 L319 366 L326 405 L274 405 Z" fill="url(#steel)" stroke="#d8f6ff" stroke-width="3"/>
  <path d="M252 402 L348 402 L362 424 L238 424 Z" fill="url(#steel)" stroke="#f1fdff" stroke-width="3"/>
  <path d="M238 424 L362 424 L373 443 L227 443 Z" fill="#284c78" stroke="#c3ecff" stroke-width="4"/>
  <path d="M300 207 L313 239 L347 241 L321 264 L330 297 L300 279 L270 297 L279 264 L253 241 L287 239 Z" fill="#ffffff" stroke="#74cfff" stroke-width="3" filter="url(#glowG)"/>
</g>

<!-- coroa e nome -->
<g filter="url(#glowG)">
  <path d="M280 452 L276 432 L290 442 L300 426 L310 442 L324 432 L320 452 Z" fill="url(#gold)" stroke="#476b8a" stroke-width="1"/>
  <circle cx="276" cy="430" r="2.5" fill="#ffffff"/><circle cx="300" cy="424" r="2.5" fill="#ffffff"/><circle cx="324" cy="430" r="2.5" fill="#ffffff"/>
</g>
<text x="300" y="498" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-weight="900" font-size="42" letter-spacing="5" fill="url(#gold)" stroke="#2b597a" stroke-width=".8" filter="url(#glowG)">PBH</text>

<!-- brilho de platina -->
<g clip-path="url(#co)"><rect class="sheen" x="150" y="0" width="120" height="600" fill="url(#shn)" transform="skewX(-18)"/></g>
</svg>
</div>

<div class="controls"><button id="replay" type="button">▶ Desbloquear platina</button><label><input id="sound" type="checkbox" checked> Som de conquista</label></div>
<section class="card">
  <h1>Conquista de Platina</h1>
  <p class="tag">Troféu de platina · conquista lendária</p>
  <p>Você conquistou o nível máximo. Um símbolo de dedicação, excelência e superação.</p>
</section>
</main>

<script>
(function(){
  var NS="http://www.w3.org/2000/svg";
  function el(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
  // feixes de luz atrás do halter
  var bm=document.getElementById("beams");
  for(var i=0;i<12;i++){
    var a=i*30*Math.PI/180,w=.1;
    el("polygon",{points:"300,285 "+(300+260*Math.cos(a-w))+","+(285+260*Math.sin(a-w))+" "+(300+260*Math.cos(a+w))+","+(285+260*Math.sin(a+w)),fill:"url(#beam)"},bm);
  }
  // gemas e marcas de ciclo ao longo da moldura
  var O=[[300,40],[525,170],[525,430],[300,560],[75,430],[75,170]],
      I=[[300,72],[497,186],[497,414],[300,528],[103,414],[103,186]],
      M=O.map(function(p,i){return[(p[0]+I[i][0])/2,(p[1]+I[i][1])/2]}),
      g=document.getElementById("gems");
  for(var i2=0;i2<6;i2++){
    var A=M[i2],B=M[(i2+1)%6];
    [0.16,0.32,0.68,0.84].forEach(function(t){
      var x=A[0]+(B[0]-A[0])*t,y=A[1]+(B[1]-A[1])*t;
      el("rect",{x:x-3,y:y-3,width:6,height:6,fill:"#d4f6ff",transform:"rotate(45 "+x+" "+y+")"},g);
    });
    el("circle",{cx:A[0],cy:A[1],r:7,fill:"url(#gold)",stroke:"#ffffff","stroke-width":1.5},g);
  }
  // brasas subindo
  var P=document.getElementById("parts");
  for(var j=0;j<30;j++){
    var c=el("circle",{cx:130+Math.random()*340,cy:430+Math.random()*90,r:1+Math.random()*2.2,fill:Math.random()>.5?"#d4f6ff":"#91d7ff","class":"p"},P);
    c.style.animationDuration=(5+Math.random()*6)+"s";
    c.style.animationDelay=(-Math.random()*10)+"s";
  }
})();

// Partículas, ondas e som originais para a sequência de conquista.
(function(){
const stage=document.getElementById('stage'),canvas=document.getElementById('fx'),ctx=canvas.getContext('2d');
const button=document.getElementById('replay'),sound=document.getElementById('sound');
let particles=[],start=0,raf=0,audio,soundTimer=0;
function chime(){if(!sound.checked)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume();const t=audio.currentTime;[523.25,783.99,1046.5,1567.98].forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(f,t+i*.115);g.gain.setValueAtTime(.0001,t+i*.115);g.gain.exponentialRampToValueAtTime(.095,t+i*.115+.035);g.gain.exponentialRampToValueAtTime(.0001,t+i*.115+1.25);o.connect(g).connect(audio.destination);o.start(t+i*.115);o.stop(t+i*.115+1.3)})}catch(e){}}
function play(){cancelAnimationFrame(raf);clearTimeout(soundTimer);stage.classList.remove('playing');void stage.offsetWidth;stage.classList.add('playing');start=performance.now();particles=Array.from({length:175},()=>{const a=Math.random()*Math.PI*2,s=1.2+Math.random()*6;return{x:300,y:290,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:70+Math.random()*85,r:.7+Math.random()*2.5,hue:185+Math.random()*40}});if(sound.checked){soundTimer=setTimeout(chime,1040)}draw(start)}
function draw(now){const elapsed=(now-start)/1000;ctx.clearRect(0,0,600,600);if(elapsed>.8){const k=Math.min(1,(elapsed-.8)*2.1);ctx.save();ctx.translate(300,290);for(let j=0;j<3;j++){const radius=(elapsed-.8)*130-j*46;if(radius>0&&radius<500){ctx.beginPath();ctx.arc(0,0,radius,0,Math.PI*2);ctx.strokeStyle=`rgba(165,228,255,${Math.max(0,.6-radius/550)})`;ctx.lineWidth=3-j*.6;ctx.stroke()}}ctx.restore();for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vx*=.992;p.vy=p.vy*.992+.013;p.life-=1;const alpha=Math.max(0,Math.min(1,p.life/55))*k;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`hsla(${p.hue},100%,85%,${alpha})`;ctx.shadowColor='#72dcff';ctx.shadowBlur=13;ctx.fill()}ctx.shadowBlur=0}if(elapsed<5.2)raf=requestAnimationFrame(draw)}
button.addEventListener('click',play);
// A animação inicial não toca som até a interação do usuário.
window.addEventListener('load',()=>{const enabled=sound.checked;sound.checked=false;play();sound.checked=enabled},{once:true});
})();
</script>
</body>
</html>
