<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PBH • Capa Sunset</title><style>*{box-sizing:border-box}body{margin:0;background:#090911;color:#eae4e8;font:14px system-ui,Arial;min-height:100vh;display:grid;place-items:center;padding:22px}.wrap{width:min(960px,100%)}h1{font-size:19px;margin:0 0 6px}p{color:#aaa5b8;margin:0 0 16px}.cover{position:relative;aspect-ratio:3/1;width:100%;overflow:hidden;border-radius:18px;box-shadow:0 22px 65px #000a,0 0 0 1px #e8a97455;background:#3c244e}canvas{display:block;width:100%;height:100%}.overlay{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#0c0b1a66,transparent 25%,transparent 75%,#100a1d50)}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}button{background:#262033;color:white;border:1px solid #6b4d64;border-radius:9px;padding:10px 15px;cursor:pointer}button:hover{background:#493044}.note{font-size:12px;color:#9b91a3;margin-top:12px}@media(max-width:600px){.cover{border-radius:12px}body{padding:14px}}body{padding:0!important;display:block!important;min-height:0!important;height:100vh;overflow:hidden}.wrap{width:100%;height:100%}.wrap>h1,.wrap>p,.controls,.note{display:none!important}.cover{width:100%;height:100%;aspect-ratio:auto;border-radius:0!important;box-shadow:none}canvas{width:100%;height:100%}</style></head><body><main class="wrap"><h1>PBH Oficial — Capa Horizonte Sunset</h1><p>Capa horizontal animada para o cabeçalho do perfil • proporção 3:1</p><div class="cover"><canvas id="scene" aria-label="Pôr do sol animado com oceano, nuvens e pássaros"></canvas><div class="overlay"></div></div><div class="controls"><button id="pause">Pausar</button><button id="mode">Intensidade: suave</button><button id="restart">Reiniciar</button></div><div class="note">A faixa se adapta à largura disponível. Para integrar no app, mantenha a proporção 3:1 e sobreponha os elementos do perfil fora deste canvas.</div></main><script>
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');let W=1200,H=400,paused=false,strong=false,start=performance.now(),elapsed=0,last=0;const TAU=Math.PI*2;let birds=[],clouds=[],sparks=[];const rand=(a,b)=>a+Math.random()*(b-a);function setup(){birds=Array.from({length:7},(_,i)=>({x:rand(-400,1250),y:rand(65,180),speed:rand(8,19),scale:rand(.5,1.15),phase:rand(0,7)}));clouds=Array.from({length:13},(_,i)=>({x:rand(-300,1300),y:rand(15,215),w:rand(120,360),h:rand(16,49),speed:rand(1.5,7),alpha:rand(.07,.22)}));sparks=Array.from({length:65},()=>({x:rand(0,1200),y:rand(60,340),phase:rand(0,7),speed:rand(1,4),r:rand(.5,1.8)}))}setup();function resize(){let rect=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(rect.width*d);canvas.height=Math.round(rect.height*d);ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0)}window.addEventListener('resize',resize);resize();
function sky(t){let g=ctx.createLinearGradient(0,0,0,285);g.addColorStop(0,'#211b43');g.addColorStop(.28,'#6a376c');g.addColorStop(.56,'#c05b70');g.addColorStop(.79,'#f1a15f');g.addColorStop(1,'#f8bf70');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);let blush=ctx.createRadialGradient(610,245,10,610,245,520);blush.addColorStop(0,'#ffda8a88');blush.addColorStop(.55,'#ef798533');blush.addColorStop(1,'#6b2b7400');ctx.fillStyle=blush;ctx.fillRect(0,0,W,320)}
function sun(t){let cy=237+Math.sin(t*.08)*5;let glow=ctx.createRadialGradient(610,cy,14,610,cy,200);glow.addColorStop(0,'#fff5c6cc');glow.addColorStop(.24,'#ffcc80a8');glow.addColorStop(.55,'#ff9e6370');glow.addColorStop(1,'#ff9e6300');ctx.fillStyle=glow;ctx.fillRect(390,30,440,400);ctx.beginPath();ctx.arc(610,cy,65,0,TAU);let g=ctx.createLinearGradient(0,cy-65,0,cy+65);g.addColorStop(0,'#fff5cf');g.addColorStop(1,'#ffb568');ctx.fillStyle=g;ctx.fill()}
function cloud(c,t){let x=(c.x+t*c.speed*(strong?1.7:1))%1550-160,y=c.y+Math.sin(t*.16+c.x)*2;ctx.save();ctx.globalAlpha=c.alpha;ctx.fillStyle=y>140?'#6d3b66':'#a77aa2';ctx.beginPath();ctx.ellipse(x,y,c.w*.55,c.h*.45,0,0,TAU);ctx.ellipse(x+c.w*.25,y+5,c.w*.38,c.h*.38,0,0,TAU);ctx.ellipse(x-c.w*.27,y+6,c.w*.34,c.h*.3,0,0,TAU);ctx.fill();ctx.restore()}
function mountains(){ctx.fillStyle='#523554';ctx.beginPath();ctx.moveTo(0,278);for(let x=0;x<=1200;x+=30)ctx.lineTo(x,272+Math.sin(x*.013)*13+Math.sin(x*.043)*6);ctx.lineTo(1200,310);ctx.lineTo(0,310);ctx.fill();ctx.fillStyle='#2d2745';ctx.beginPath();ctx.moveTo(0,282);for(let x=0;x<=1200;x+=20)ctx.lineTo(x,287+Math.sin(x*.018+1)*7+Math.sin(x*.071)*3);ctx.lineTo(1200,310);ctx.lineTo(0,310);ctx.fill()}
function sea(t){let g=ctx.createLinearGradient(0,277,0,400);g.addColorStop(0,'#b95c76');g.addColorStop(.17,'#7c416b');g.addColorStop(.62,'#332b59');g.addColorStop(1,'#161d39');ctx.fillStyle=g;ctx.fillRect(0,281,1200,119);ctx.save();ctx.beginPath();ctx.rect(0,281,1200,119);ctx.clip();for(let i=0;i<95;i++){let y=284+i*1.45,phase=t*(strong?1.8:1)*(.6+i*.01),depth=(y-280)/120;let width=6+depth*45+Math.abs(Math.sin(i*6.4))*30;let x=610+Math.sin(i*14.3+phase)*depth*100;ctx.strokeStyle=`rgba(255,${Math.floor(178+depth*35)},${Math.floor(114+depth*55)},${Math.max(0,.55-depth*.3)})`;ctx.lineWidth=.65+depth*1.6;ctx.beginPath();ctx.moveTo(x-width/2,y);ctx.quadraticCurveTo(x,y+Math.sin(phase+i)*1.5,x+width/2,y);ctx.stroke()}for(let i=0;i<120;i++){let y=282+(i*47%117),x=((i*139+t*(strong?22:11)*(i%3+1))%1330)-50;ctx.strokeStyle=`rgba(248,181,169,${.045+(i%5)*.012})`;ctx.lineWidth=.6+(y-282)/100;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+14+(i%6)*12,y+Math.sin(t+i)*1.3);ctx.stroke()}ctx.restore()}
function silhouette(){ctx.fillStyle='#151b32';ctx.beginPath();ctx.moveTo(0,400);ctx.lineTo(0,333);ctx.bezierCurveTo(55,326,73,352,135,342);ctx.bezierCurveTo(200,324,215,359,270,361);ctx.lineTo(312,400);ctx.fill();ctx.beginPath();ctx.moveTo(1200,400);ctx.lineTo(1200,333);ctx.bezierCurveTo(1140,325,1095,350,1038,345);ctx.bezierCurveTo(987,341,955,367,920,374);ctx.lineTo(900,400);ctx.fill();ctx.fillStyle='#0f162c';for(let i=0;i<12;i++){let x=i*29-10;ctx.beginPath();ctx.moveTo(x,365);ctx.lineTo(x+5,331-i%3*9);ctx.lineTo(x+10,365);ctx.fill()}for(let i=0;i<12;i++){let x=945+i*26;ctx.beginPath();ctx.moveTo(x,369);ctx.lineTo(x+5,335-i%4*7);ctx.lineTo(x+10,369);ctx.fill()}}
function bird(b,t){let x=(b.x+t*b.speed*(strong?1.7:1))%1550-120,y=b.y+Math.sin(t*.55+b.phase)*5;let wing=Math.sin(t*5+b.phase)*5;ctx.strokeStyle='#332744b8';ctx.lineWidth=1.9*b.scale;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-11*b.scale,y-3-wing*.4);ctx.quadraticCurveTo(x-4*b.scale,y-9-wing,x,y);ctx.quadraticCurveTo(x+4*b.scale,y-9-wing,x+11*b.scale,y-3-wing*.4);ctx.stroke()}
function dust(t){for(let p of sparks){let x=p.x+Math.sin(t*p.speed*.16+p.phase)*16,y=p.y+Math.cos(t*.35+p.phase)*10;ctx.globalAlpha=(.12+.2*(.5+.5*Math.sin(t*1.5+p.phase)));ctx.fillStyle='#ffe6b4';ctx.beginPath();ctx.arc(x,y,p.r,0,TAU);ctx.fill()}ctx.globalAlpha=1}
function render(t){ctx.clearRect(0,0,W,H);sky(t);sun(t);clouds.forEach(c=>cloud(c,t));birds.forEach(b=>bird(b,t));mountains();sea(t);silhouette();dust(t)}function frame(now){if(!last)last=now;let dt=Math.min((now-last)/1000,.05);last=now;if(!paused)elapsed+=dt;render(elapsed);requestAnimationFrame(frame)}requestAnimationFrame(frame);document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Retomar':'Pausar'};document.getElementById('mode').onclick=e=>{strong=!strong;e.target.textContent='Intensidade: '+(strong?'intensa':'suave')};document.getElementById('restart').onclick=()=>{elapsed=0;setup()};
</script></body></html>
